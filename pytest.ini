[pytest]
# ATOS-P0-EXEC-001 / ATOS-P2-FAULT-001: the adversarial suites assert what the
# system does when the broker, the network, or the clock misbehaves. They are
# registered as a marker so CI can select them as their own gate.
markers =
    adversarial: failure-mode tests that prove the system stays conservative under ambiguity
