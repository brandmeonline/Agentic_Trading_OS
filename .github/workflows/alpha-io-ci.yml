name: Alpha IO CI

# ATOS-P0-SEC-001: no path filters. A credential can be committed anywhere in
# the tree, so the secret scan must run on every push and pull request rather
# than only when "Alpha IO/**" happens to change.
on:
  pull_request:
  push:
    branches:
      - main

# ATOS-P2-CI-001. Four jobs, in dependency order:
#
#   secret-scan  -> everything else. A commit carrying a credential must not
#                   be able to go green on the strength of its tests.
#   quality      -> ruff, mypy, bandit, pip-audit. Static gates, no network
#                   dependency beyond pip-audit's advisory database.
#   regression   -> compileall, the full suite with sockets blocked, the
#                   adversarial marker suite, and the coverage floors.
#   paper-smoke  -> optional, credential-gated, paper only.

jobs:
  secret-scan:
    name: Secret hygiene (ATOS-P0-SEC-001)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan sees the tree as published, not a
          # shallow slice of it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Alpha IO/requirements-ci.txt"

      - name: Scan tracked files for credentials
        run: python -m pytest -q "Alpha IO/tests/test_secret_hygiene.py"

  quality:
    name: Static analysis
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from the dependency manifests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Alpha IO/requirements-ci.txt"
          python -m pip install -r "Alpha IO/requirements.txt"

      - name: Ruff
        run: ruff check .

      # Strict-first on the modules that decide what reaches a broker. The
      # rest of the tree is not clean under mypy yet; typing it is worth its
      # own change, and a check that runs everywhere and passes nowhere is
      # not a gate.
      - name: mypy (execution, risk, reconciliation, credentials)
        working-directory: Alpha IO
        run: |
          mypy --follow-imports=skip --ignore-missing-imports \
            core/execution.py \
            core/risk.py \
            core/reconciliation.py \
            core/credentials.py \
            core/order_intent.py \
            core/runtime_state.py \
            core/readiness.py \
            core/money.py \
            core/exposure.py \
            core/risk_anchors.py \
            core/live_authorization.py \
            core/control_plane.py \
            core/persistence_policy.py \
            core/safety_config.py \
            core/operator_status.py \
            core/net_guard.py \
            core/leakage.py \
            core/fill_model.py \
            core/model_governance.py \
            core/swarm_arbitration.py \
            core/alerting.py

      # Production code at medium severity and above. Every finding is either
      # fixed or carries a "# nosec <id>" with the reasoning on the line above.
      - name: Bandit (production code)
        run: bandit -q -r "Alpha IO" --exclude "Alpha IO/tests" --severity-level medium

      # Tests are scanned too, with two rules off: B101 because assert is what
      # a test is made of, and B104 because several tests bind 0.0.0.0 in
      # order to assert that the bind auditor objects to it.
      - name: Bandit (tests)
        run: bandit -q -r "Alpha IO/tests" --severity-level medium --skip B101,B104

      # Fails on any known vulnerability in the declared dependencies. To
      # accept one deliberately, add --ignore-vuln <id> here with a comment
      # saying who accepted it and why; an undocumented exception is the
      # thing this gate exists to prevent.
      - name: pip-audit
        run: pip-audit -r "Alpha IO/requirements.txt" --progress-spinner off

  regression:
    name: Tests and coverage
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from the dependency manifests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Alpha IO/requirements-ci.txt"
          python -m pip install -r "Alpha IO/requirements.txt"

      - name: Compile Alpha IO
        run: python -m compileall -q "Alpha IO"

      # The whole directory, not a curated list. The list was the bug: a new
      # test file was in the suite locally and invisible in CI until somebody
      # remembered to add it.
      #
      # -p no_network blocks every non-loopback socket for the duration, which
      # is the "no real-network dependency for core safety tests" requirement
      # enforced rather than stated.
      - name: Full suite, with the network blocked
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q -p no_network "Alpha IO/tests" \
            --cov=core --cov-report=json:coverage.json --cov-report=term

      - name: Adversarial suite (ATOS-P0-EXEC-001)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no_network -m adversarial "Alpha IO/tests"

      # Per-module ratchet floors on the code that can lose money. A global
      # percentage would let the order lifecycle rot behind a well-tested
      # chart module.
      - name: Coverage floors for the safety modules
        run: python "Alpha IO/tools/coverage_gate.py" coverage.json

  paper-smoke:
    name: Optional Alpaca paper smoke
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Paper credentials only, with the minimum permissions the smoke test
      # needs. A live key must never be available to CI: anything that can
      # read this environment can place an order with it.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from the dependency manifests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Alpha IO/requirements-ci.txt"
          python -m pip install -r "Alpha IO/requirements.txt"

      # The only step in the pipeline that touches a network. Skipped, not
      # failed, when the credentials are absent - a fork's pull request has
      # no access to them and must still be able to go green.
      - name: Run Alpaca paper smoke
        if: ${{ env.ALPACA_API_KEY != '' && env.ALPACA_API_SECRET != '' }}
        run: python -m pytest -q "Alpha IO/tests/test_alpaca_paper_smoke.py"
