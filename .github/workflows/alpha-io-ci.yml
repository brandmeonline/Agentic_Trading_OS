name: Alpha IO CI

# ATOS-P0-SEC-001: no path filters. A credential can be committed anywhere in
# the tree, so the secret scan must run on every push and pull request rather
# than only when "Alpha IO/**" happens to change.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret hygiene (ATOS-P0-SEC-001)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan sees the tree as published, not a
          # shallow slice of it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Scan tracked files for credentials
        run: python -m pytest -q "Alpha IO/tests/test_secret_hygiene.py"

  regression:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas flask werkzeug cryptography pytest scikit-learn

      - name: Compile Alpha IO
        run: python -m compileall -q "Alpha IO"

      - name: Run explicit regression suite
        run: |
          python -m pytest -q \
            "Alpha IO/tests/test_advanced_modules.py" \
            "Alpha IO/tests/test_agent.py" \
            "Alpha IO/tests/test_asymmetry_measured.py" \
            "Alpha IO/tests/test_cancel_fill_race.py" \
            "Alpha IO/tests/test_corpus_alerts.py" \
            "Alpha IO/tests/test_credentials_security.py" \
            "Alpha IO/tests/test_headroom_compress.py" \
            "Alpha IO/tests/test_ledger_execution.py" \
            "Alpha IO/tests/test_live_recovery.py" \
            "Alpha IO/tests/test_llm_client.py" \
            "Alpha IO/tests/test_market_view.py" \
            "Alpha IO/tests/test_news_feed.py" \
            "Alpha IO/tests/test_order_idempotency.py" \
            "Alpha IO/tests/test_order_intent_wal.py" \
            "Alpha IO/tests/test_order_lifecycle_adversarial.py" \
            "Alpha IO/tests/test_pipeline_and_eval.py" \
            "Alpha IO/tests/test_plan_milestones.py" \
            "Alpha IO/tests/test_reports_scheduler.py" \
            "Alpha IO/tests/test_rest_api_security.py" \
            "Alpha IO/tests/test_risk.py" \
            "Alpha IO/tests/test_run_web_security.py" \
            "Alpha IO/tests/test_secret_hygiene.py" \
            "Alpha IO/tests/test_services.py" \
            "Alpha IO/tests/test_terminal_view.py" \
            "Alpha IO/tests/test_unified_engine.py" \
            "Alpha IO/tests/test_web_security.py"

      - name: Run adversarial suite (ATOS-P0-EXEC-001)
        run: python -m pytest -q -m adversarial "Alpha IO/tests"

      - name: Run optional Alpaca paper smoke
        if: ${{ env.ALPACA_API_KEY != '' && env.ALPACA_API_SECRET != '' }}
        run: python -m pytest -q "Alpha IO/tests/test_alpaca_paper_smoke.py"
